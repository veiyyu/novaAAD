<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuro-Steered Hearing — Live</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#111823; --card:#151c26; --card-on:#12241c; --ink:#e8edf3;
    --mute:#8b97a6; --line:#26303c; --a:#2E86DE; --b:#E1A400; --good:#37c26b; --eeg:#5ad1c8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 20px 30px}
  header{text-align:center;margin-bottom:12px}
  header h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
  header p{margin:5px 0 0;color:var(--mute);font-size:13.5px}
  .banner{margin:12px auto 16px;max-width:820px;padding:9px 16px;border-radius:10px;
    background:var(--panel);border:1px solid var(--line);color:var(--mute);
    font-size:14px;text-align:center}
  .banner b{color:var(--ink)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:16px}
  .panel .lbl{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em;
    margin-bottom:8px}
  .panel .lbl b{color:var(--eeg)}
  #eeg{width:100%;height:170px;display:block}
  .cards{display:flex;gap:16px}
  .card{flex:1;background:var(--card);border:2px solid var(--line);border-radius:16px;
    padding:18px;display:flex;flex-direction:column;align-items:center;
    transition:border-color .25s, background .25s;min-height:300px}
  .card.on{border-color:var(--good);background:var(--card-on)}
  .name{font-size:22px;font-weight:700;margin-bottom:4px}
  .card.a .name{color:var(--a)} .card.b .name{color:var(--b)}
  .meter{flex:1;width:96px;margin:12px 0;background:#0e141c;border-radius:9px;
    position:relative;overflow:hidden;border:1px solid var(--line)}
  .fill{position:absolute;left:0;right:0;bottom:0;height:2%;transition:height .1s linear}
  .card.a .fill{background:var(--a)} .card.b .fill{background:var(--b)}
  .db{font-size:18px;font-variant-numeric:tabular-nums;margin:2px 0 8px}
  .status{font-size:14px;font-weight:700;color:var(--mute)}
  .status.on{color:var(--good)}
  .dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.3em;
    vertical-align:baseline;background:var(--mute)}
  .status.on .dot{background:var(--good)}
  .balance{margin-top:14px}
  .balance .track{height:14px;border-radius:7px;position:relative;overflow:hidden;
    background:linear-gradient(90deg,var(--a),#20303f 45%,#20303f 55%,var(--b))}
  .balance .needle{position:absolute;top:-3px;width:4px;height:20px;border-radius:2px;
    background:#fff;transform:translateX(-50%);transition:left .2s ease}
  .balance .ends{display:flex;justify-content:space-between;color:var(--mute);
    font-size:12px;margin-top:5px}
  footer{text-align:center;color:var(--mute);font-size:12.5px;
    font-variant-numeric:tabular-nums;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Neuro-Steered Hearing</h1>
    <p>Reading the listener's brainwaves and amplifying the voice they're focusing on.</p>
    <div class="banner" id="banner">Warming up…</div>
  </header>

  <div class="panel">
    <div class="lbl">Live EEG — <b>the listener's brain</b> (attention is decoded from this)</div>
    <canvas id="eeg" width="1040" height="170"></canvas>
  </div>

  <div class="cards">
    <section class="card a" id="cardA">
      <div class="name">Talker A</div>
      <div class="meter"><div class="fill" id="fillA"></div></div>
      <div class="db" id="dbA">— dB</div>
      <div class="status" id="statusA"><span class="dot"></span><span>—</span></div>
    </section>
    <section class="card b" id="cardB">
      <div class="name">Talker B</div>
      <div class="meter"><div class="fill" id="fillB"></div></div>
      <div class="db" id="dbB">— dB</div>
      <div class="status" id="statusB"><span class="dot"></span><span>—</span></div>
    </section>
  </div>

  <div class="panel balance">
    <div class="lbl">Where the brain is pointing (decoded attention)</div>
    <div class="track"><div class="needle" id="needle" style="left:50%"></div></div>
    <div class="ends"><span>◀ Talker A</span><span>Talker B ▶</span></div>
  </div>

  <footer id="footer">—</footer>
</div>
